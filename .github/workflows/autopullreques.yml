name: Auto PR

on:
  push:
    branches:
      - '*'
      - '*/*'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: "Auto PR"
          body: "Pull Request created succesfully"
