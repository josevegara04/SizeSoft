<div class="parts-page">
  <section class="page-hero">
    <div>
      <h2>Causas de Mantenimiento</h2>
      <p>Administre las causas que originan intervenciones preventivas, correctivas o reactivas.</p>
    </div>
    <button type="button" class="btn-search hero-action" (click)="openModal()" title="Buscar causas">
      <span class="button-icon">🔍</span>
      Buscar causas
    </button>
  </section>

  <section class="form-panel">
    <div class="panel-header">
      <div>
        <span class="section-kicker">Ficha de causa</span>
        <h3>Información general</h3>
      </div>
    </div>

    <div class="form-container">
      <div class="form-group">
        <label>ID causa</label>
        <input type="number" placeholder="Ej: 1" [(ngModel)]="IdCausMant" name="idCausMant" />
      </div>

      <div class="form-group">
        <label>Código causa</label>
        <input type="text" placeholder="Ej: FALLA_ELEC" [(ngModel)]="CodiCaus" name="codiCaus" />
      </div>

      <div class="form-group">
        <label>Nombre causa</label>
        <input type="text" placeholder="Ej: Falla eléctrica" [(ngModel)]="NombCaus" name="nombCaus" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input
          type="text"
          placeholder="Ej: Problemas relacionados con cableado o sensores"
          [(ngModel)]="Descri"
          name="descri"
        />
      </div>

      <div class="form-group">
        <label>Tipo Mantenimiento</label>
        <select [(ngModel)]="TipoMant" name="tipoMant">
          <option value="">Seleccione</option>
          <option value="Preventivo">Preventivo</option>
          <option value="Correctivo">Correctivo</option>
          <option value="Reactivo">Reactivo</option>
        </select>
      </div>

      <div class="form-group">
        <label>Activo</label>
        <select [(ngModel)]="Activo" name="activo">
          <option [ngValue]="1">Activo</option>
          <option [ngValue]="0">Inactivo</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="clearForm()">
          Limpiar
        </button>

        @if (!isEditing) {
          <button type="button" class="btn-primary" (click)="handleCause(1)">
            <span class="button-icon">💾</span>
            Guardar
          </button>
        }

        @if (isEditing) {
          <button type="button" class="btn-primary" (click)="handleCause(3)">
            <span class="button-icon">✏️</span>
            Guardar cambios
          </button>
          <button type="button" class="btn-danger" (click)="handleCause(2)">
            <span class="button-icon">🗑️</span>
            Eliminar
          </button>
        }
      </div>
    </div>
  </section>
</div>

<app-causas-mantenimiento-modal
  *ngIf="showModal"
  (close)="closeModal()"
  (select)="fillForm($event)">
</app-causas-mantenimiento-modal>
