<div class="parts-page">
  <section class="page-hero">
    <div>
      <h2>Mantenimientos</h2>
      <p>Defina los planes de mantenimiento, su frecuencia y la máquina asociada.</p>
    </div>
    <button type="button" class="btn-search hero-action" (click)="openModal()" title="Buscar mantenimientos">
      <span class="button-icon">🔍</span>
      Buscar mantenimientos
    </button>
  </section>

  <section class="form-panel">
    <div class="panel-header">
      <div>
        <span class="section-kicker">Ficha de mantenimiento</span>
        <h3>Información general</h3>
      </div>
    </div>

    <div class="form-container">
      <div class="form-group">
        <label>ID mantenimiento</label>
        <input type="text" placeholder="Ej: MT001" [(ngModel)]="idMantenimiento" name="idMantenimiento" />
      </div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" placeholder="Ej: Mantenimiento Preventivo" [(ngModel)]="nombre" name="nombre" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input
          type="text"
          placeholder="Ej: Cambio de piezas periódicas"
          [(ngModel)]="Descripcion"
          name="Descripcion"
        />
      </div>

      <div class="form-group">
        <label>Código Maquina</label>
        <input type="text" placeholder="Ej: M001" [(ngModel)]="CodiMaqu" name="CodiMaqu" />
        <button type="button" class="btn-inline-search" (click)="toggleMachineSelector()">
          {{ showMachineSelector ? 'Ocultar máquinas' : 'Buscar máquina' }}
        </button>

        @if (showMachineSelector) {
          <div class="selector-panel">
            <input
              type="text"
              [(ngModel)]="machineSearchTerm"
              name="machineSearchTerm"
              placeholder="Buscar por código" />

            <div class="selector-results">
              @for (item of filteredMachineResults; track item.CodiMaqu) {
                <button type="button" class="selector-item" (click)="selectMachine(item)">
                  <strong>{{ item.CodiMaqu }}</strong>
                </button>
              } @empty {
                <p class="selector-empty">No se encontraron máquinas.</p>
              }
            </div>
          </div>
        }
      </div>

      <div class="form-group">
        <label>Tiempo</label>
        <input type="number" [(ngModel)]="tiempoDias" name="tiempoDias" placeholder="Ej: 30" />
      </div>

      <div class="form-group">
        <label>Tipo Mantenimiento</label>
        <select [(ngModel)]="TipoMant" name="TipoMant">
          <option value="">Seleccione</option>
          <option value="Preventivo">Preventivo</option>
          <option value="Reactivo">Reactivo</option>
          <option value="Correctivo">Correctivo</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-primary" (click)="handleMaintenance(1)">
          <span class="button-icon">💾</span>
          Guardar
        </button>
        <button type="button" class="btn-danger" (click)="handleMaintenance(2)">
          <span class="button-icon">🗑️</span>
          Eliminar
        </button>
      </div>
    </div>
  </section>
</div>

<app-mantenimientos-modal
  *ngIf="showModal"
  (close)="closeModal()"
  (select)="onSelectMaintenance($event)">
</app-mantenimientos-modal>
