<!-- =================== HEADER =================== -->
<div class="page-container">
  <h1 class="page-title">MÁQUINAS — Partes Vulnerables</h1>

  <!-- =================== NOTIFICATION =================== -->
  @if (notification) {
  <div class="notification" [class]="'notification ' + notification.type">
    <span class="notification-icon">{{ notification.type === 'success' ? '✅' : '⚠️' }}</span>
    <span class="notification-text">{{ notification.message }}</span>
    <button class="notification-close" (click)="notification = null">✕</button>
  </div>
  }

  <!-- =================== FORM =================== -->
  <div class="form-card">
    <div class="form-header">
      <span class="form-icon">🧾</span>
      <h2>Registrar Parte de Máquina</h2>
    </div>

    <div class="form-body">
      <div class="form-grid">

        <!-- Nombre de la parte -->
        <div class="field-group">
          <label for="nombreParte">Nombre de la parte</label>
          <input id="nombreParte" type="text" placeholder="Ej: Rodamiento principal"
            [(ngModel)]="nombreParte" />
        </div>

        <!-- Código de la parte -->
        <div class="field-group">
          <label for="codigoParte">Código de la parte</label>
          <input id="codigoParte" type="text" placeholder="Ej: ROD-001"
            [(ngModel)]="codigoParte" />
        </div>

        <!-- Código de la máquina -->
        <div class="field-group">
          <label for="codigoMaquina">Código de la máquina</label>
          <input id="codigoMaquina" type="text" placeholder="Ej: M001"
            [(ngModel)]="codigoMaquina" />
        </div>

      </div>

      <!-- Botón -->
      <div class="form-actions">
        <button type="button" class="btn-register" (click)="addPart()">
          <span>💾</span> Registrar Parte
        </button>
      </div>
    </div>
  </div>
</div>
