<div class="submodule">
  <h2>Partes de Máquina</h2>

  <div class="form-container">

    <!-- Código Parte -->
    <div class="form-group">
      <label>Código Parte</label>
      <input type="text" placeholder="Ej: A001" [(ngModel)]="CodiPart" name="codigoParte"/>
    </div>

    <!-- Código Máquina -->
    <div class="form-group">
      <label>Código Máquina</label>
      <input type="text" placeholder="Ej: M001" [(ngModel)]="CodiMaqu" name="codigoParte"/>
    </div>

    <!-- Tipo Parte -->
    <div class="form-group">
      <label>Tipo Parte</label>
      <input [(ngModel)]="idTipoPart" name="idTipoPart" type="number"/>
    </div>

    <!-- Nombre Parte -->
    <div class="form-group">
      <label>Nombre Parte</label>
      <input type="text" placeholder="Ej: Filtro de aceite" [(ngModel)]="nombreParte" name="nombreParte"/>
    </div>

    <!-- BOTONES -->
    <div class="form-actions">
      <button type="button" class="btn-primary" (click)="handlePart(1)">Guardar</button>
      <button type="button" class="btn-danger" (click)="handlePart(2)">Eliminar</button>
    </div>

  </div>
</div>
