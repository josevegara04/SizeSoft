<div class="submodule">

  <div class="submodule-header">
    <h2>Operarios</h2>
    <button type="button" class="btn-search" (click)="openModal()">Buscar operario</button>
  </div>

  <!-- CAMPOS PRINCIPALES -->
  <div class="form-container">

    <div class="form-group">
      <label>Nombre <span class="required">*</span></label>
      <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Carlos" />
    </div>

    <div class="form-group">
      <label>Apellido <span class="required">*</span></label>
      <input type="text" [(ngModel)]="apellid" name="apellid" placeholder="Ej: Gómez" />
    </div>

    <div class="form-group">
      <label>Cédula <span class="required">*</span></label>
      <input type="text" [(ngModel)]="cedula" name="cedula" placeholder="Ej: 123456789" />
    </div>

    <div class="form-group">
      <label>Cargo <span class="required">*</span></label>
      <input type="text" [(ngModel)]="cargo" name="cargo" placeholder="Ej: Técnico" />
    </div>

    <div class="form-group">
      <label>Especialidad</label>
      <input type="text" [(ngModel)]="especi" name="especi" placeholder="Ej: Mecánico" />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" [(ngModel)]="telefo" name="telefo" placeholder="Ej: 3001234567" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Ej: correo@empresa.com" />
    </div>

    <div class="form-group">
      <label>Estado</label>
      <select [(ngModel)]="activo" name="activo">
        <option [value]="1">Activo</option>
        <option [value]="0">Inactivo</option>
      </select>
    </div>

  </div>

  <!-- ACCIONES -->
  <div class="form-actions">

    <button type="button" class="btn-secondary" (click)="clearForm()">Limpiar</button>

    @if (idOper === null) {
      <button type="button" class="btn-primary" (click)="handleOperario(1)">Crear Operario</button>
    }

    @if (idOper !== null) {
      <button type="button" class="btn-primary" (click)="handleOperario(1)">Guardar Cambios</button>
      <button type="button" class="btn-danger" (click)="handleOperario(2)">Eliminar</button>
    }

  </div>

</div>

@if (showModal) {
  <app-operarios-modal
    (close)="closeModal()"
    (select)="onSelectOperario($event)">
  </app-operarios-modal>
}
