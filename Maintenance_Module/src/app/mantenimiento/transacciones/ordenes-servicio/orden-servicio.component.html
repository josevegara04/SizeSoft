<div class="submodule">

    <h2>Órdenes de Servicio</h2>
  
    <div class="form-container">
  
      <!-- Código Orden -->
      <div class="form-group">
        <label>Código Orden</label>
        <input type="text" placeholder="ORD-001" />
      </div>
  
      <!-- Código Máquina -->
      <div class="form-group">
        <label>Código Máquina</label>
        <input type="text" placeholder="M001" />
      </div>
  
      <!-- Fecha inicio -->
      <div class="form-group">
        <label>Fecha Inicio</label>
        <input type="datetime-local" />
      </div>
  
      <!-- Tipo mantenimiento -->
      <div class="form-group">
        <label>Tipo de Mantenimiento</label>
        <select>
          <option value="">Seleccione</option>
          <option>Preventivo</option>
          <option>Correctivo</option>
          <option>Reactivo</option>
        </select>
      </div>
  
      <!-- Mantenimiento -->
      <div class="form-group">
        <label>ID Mantenimiento</label>
        <input type="number" />
      </div>
  
      <!-- Repuesto -->
      <div class="form-group">
        <label>ID Repuesto</label>
        <input type="number" />
      </div>
  
      <!-- Cantidad -->
      <div class="form-group">
        <label>Cantidad</label>
        <input type="number" min="1" />
      </div>
  
      <!-- Botón -->
      <div class="form-actions">
        <button class="btn-primary">Crear Orden</button>
      </div>
  
    </div>
  
  </div>
