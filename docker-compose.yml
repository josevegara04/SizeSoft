# Desarrollo: volúmenes montados para que los cambios en código se reflejen sin reconstruir
services:
  frontend:
    build: ./Maintenance_Module
    ports:
      - "4200:4200"
    volumes:
      - ./Maintenance_Module:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm start -- --host 0.0.0.0 --poll 2000