# Desarrollo: volúmenes montados para que los cambios en código se reflejen sin reconstruir
services:
  frontend:
    build: ./Maintenance_Module
    ports:
      - "4200:4200"
    volumes:
      - ./Maintenance_Module:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm start -- --host 0.0.0.0 --poll 2000


  chatbot:
    build: ./ml_service
    ports:
      - "8000:8000"
    volumes:
      - ./ml_service:/app
    env_file:
      - ./ml_service/.env
    restart: unless-stopped