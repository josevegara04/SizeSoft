# Desarrollo: volúmenes montados para que los cambios en código se reflejen sin reconstruir
services:
  ml_service:
    build: ./ml_service
    ports:
      - "8000:8000"
    volumes:
      - ./ml_service:/app

  frontend:
    build: ./Maintenance_Module
    ports:
      - "4200:4200"
    volumes:
      - ./Maintenance_Module:/app
      - /app/node_modules
    depends_on:
      - ml_service
    environment:
      - CHOKIDAR_USEPOLLING=true
